    <!-- Prevent layout shift during loading -->

      html, body {
        width: 100%;

        overflow-x: hidden;

        padding: 0;

        height: 100vh;
        background: hsl(200 30% 8%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
